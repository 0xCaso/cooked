[workspace]
resolver = "3"
members = ["crates/cooked-model", "crates/cooked"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "6ea68a8840c6db6b14f6138ee52c688016b86905" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "6ea68a8840c6db6b14f6138ee52c688016b86905" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cooked-model = { path = "crates/cooked-model" }

# Non-incremental, no debug info: the dev Mac has little disk. Build with `--profile perf`.
[profile.perf]
inherits = "release"
opt-level = 3
codegen-units = 16
lto = false
debug = false
incremental = false

# Rune builds on patched copies of these crates (its `vendor/`); apps that build Rune patch them too.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "6ea68a8840c6db6b14f6138ee52c688016b86905" }
naga = { git = "https://github.com/anomalyco/rune", rev = "6ea68a8840c6db6b14f6138ee52c688016b86905" }
winit = { git = "https://github.com/anomalyco/rune", rev = "6ea68a8840c6db6b14f6138ee52c688016b86905" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "6ea68a8840c6db6b14f6138ee52c688016b86905" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "6ea68a8840c6db6b14f6138ee52c688016b86905" }
