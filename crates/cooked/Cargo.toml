[package]
name = "cooked"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
rune.workspace = true
rune-fx.workspace = true
cooked-model.workspace = true
# Rune's own wgpu (same version): the tile compositor names texture formats.
wgpu = { version = "30.0", default-features = false }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDate",
    "NSEnumerator",
    "NSObject",
    "NSString",
    "NSTimeZone",
    "NSUserDefaults",
    "NSValue",
] }

[dev-dependencies]
# Tests render scenes headless (`snaps.rs`), which needs Rune's tooling in a perf build.
rune = { workspace = true, features = ["tooling"] }
png = "0.18"

[features]
# Rune's agent tooling (`--snap`, `--tree`) in perf builds, for checks. Off in the shipped app.
tooling = ["rune/tooling"]
