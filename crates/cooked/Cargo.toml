[package]
name = "cooked"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
rune.workspace = true
rune-fx.workspace = true
cooked-model.workspace = true
# Rune's own wgpu (same version): the tile compositor names texture formats.
wgpu = { version = "30.0", default-features = false }
# Blocks for AppKit callbacks (the popover's click-outside monitor), the version Rune uses.
block2 = "0.6"
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-graphics",
    "NSAppearance",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSEvent",
    "NSGraphicsContext",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
# The menu bar label: dots and the percent drawn with CoreGraphics and CoreText (`mac/status_item.rs`).
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFData", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGFont",
    "CGImage",
] }
objc2-core-text = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "objc2-core-graphics",
    "CTFont",
    "CTFontDescriptor",
    "CTFontManager",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSTimeZone",
    "NSURL",
    "NSUserDefaults",
    "NSValue",
] }
# Open at login: `SMAppService.mainApp` (`mac/login.rs`).
objc2-service-management = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "SMAppService",
] }

[dev-dependencies]
# Tests render scenes headless (`snaps.rs`), which needs Rune's tooling in a perf build.
rune = { workspace = true, features = ["tooling"] }
png = "0.18"
serde_json.workspace = true

[features]
# Rune's agent tooling (`--snap`, `--tree`) in perf builds, for checks. Off in the shipped app.
tooling = ["rune/tooling"]
